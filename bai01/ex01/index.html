<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BỐN MÙA</title>
    <style>
        :root {
             --xanh: #0033CC;
            --do: #D40000;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;                            
        }
        .khung-tho{
            width: 640px;
            background-color:  #FFFDE7;            
            padding: 24px;
            text-align:center
            border 1px solid #9E9E9E;
        }
        h1{
            color: var(--do);
            text-align: center;
            background-color: #FFD9E6;
            font-size: 26px;
            padding: 6px 0;
            margin: 0 0 20px;   
        }
        .kho{
            font-style: italic;
            text-align: center;
            line-height: 1.7;
        }
        .xanh{
             color: var(--xanh);
        }
        .do{
            color: var(--do);
        }
        
        hr{ 
            width: 55%;            
            border: 1px solid var(--xanh);
        }
    </style>
</head>
<body>
    <article class="khung-tho">
        <h1>BỐN MÙA</h1>
        <p class="kho xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm            
        </p>
        <hr>
        <p class="kho do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="kho xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường

        </p>
    </article>
</body>
</html>
